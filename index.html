<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>PRISM — The Comic</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #070a18; color: #e8f4ff;
         font-family: Georgia, 'Times New Roman', serif; }
  header { text-align: center; padding: 3rem 1rem 1rem; }
  h1 { margin: 0; font-size: clamp(3rem, 12vw, 5.5rem); letter-spacing: .35em;
       text-indent: .35em; color: #6ef0ff; font-family: Verdana, Geneva, sans-serif;
       text-shadow: 0 0 24px rgba(110,240,255,.45); }
  .tag { color: #9fc6de; margin-top: .4rem; font-style: italic; }
  main { max-width: 720px; margin: 0 auto; padding: 1rem; }
  .issue { display: flex; gap: 1.2rem; align-items: center; text-decoration: none;
           color: inherit; background: #0d1428; border: 1px solid #1d3a52;
           border-radius: 14px; padding: 1rem; margin: 1.2rem 0; }
  .issue:hover { border-color: #6ef0ff; }
  .issue img { width: 110px; border-radius: 8px; display: block; }
  .issue h2 { margin: 0 0 .3rem; font-size: 1.35rem; }
  .issue p { margin: 0; color: #9fc6de; }
  footer { text-align: center; color: #5f7d92; padding: 2rem 1rem 3rem; font-size: .9rem; }
</style>
</head>
<body>
<header>
  <h1>PRISM</h1>
  <p class="tag">The hero of Port Lumen reads the light, and out-thinks the dark.</p>
</header>
<main>
  <a class="issue" href="issues/issue-01/">
    <img src="issues/issue-01/cover.png" alt="Prism, Issue 1 cover art">
    <span>
      <h2>Issue 1: The Night the Lights Went Wrong</h2>
      <p>Rolling blackouts are eating Port Lumen block by block, in a pattern only Prism can read. Eight pages, plus a choice that steers Issue 2.</p>
    </span>
  </a>
</main>
<footer>A new issue drops every week.</footer>
</body>
</html>
